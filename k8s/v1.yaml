apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-v1
  template:
    metadata:
      labels:
        app: recommendation-v1
    spec:
      containers:
        - name: recommendation-show-list
          image: mohanraj741/recommendation-show-list:v1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-v1-service
spec:
  type: NodePort
  selector:
    app: recommendation-v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001